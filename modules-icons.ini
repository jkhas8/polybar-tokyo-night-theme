;==========================================================
;
; Icon-rich Module Extensions
;
;==========================================================

; Application Launchers (moved to modules-launchers.ini)

; System Info with Icons
[module/distro-icon]
type = custom/script
exec = echo 
interval = 100000
format-foreground = ${colors.blue}
format-padding = 1
click-left = neofetch

[module/arch-icon]
type = custom/script
exec = echo 
interval = 100000
format-foreground = ${colors.blue}
format-padding = 1

[module/ubuntu-icon]
type = custom/script
exec = echo 
interval = 100000
format-foreground = ${colors.orange}
format-padding = 1


; Network Icons Enhanced
[module/network-speed]
type = internal/network
interface-type = wired
interval = 1.0

format-connected = <label-connected>
label-connected = %{F#7dcfff} %{F-}%downspeed% %{F#9ece6a} %{F-}%upspeed%

[module/wifi-icon]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.cyan}

; Media Player Icons
[module/spotify]
type = custom/script
interval = 1
format-prefix = " "
format-prefix-foreground = ${colors.green}
format = <label>
exec = python3 ~/.config/polybar/scripts/spotify_status.py -f '{artist}: {song}'
format-underline = ${colors.green}

[module/mpd-icon]
type = internal/mpd
format-online = <icon-prev> <icon-stop> <toggle> <icon-next> <label-song>
format-stopped = 󰝛 Stopped
format-offline = 󰝛 Offline

icon-play = 
icon-pause = 
icon-stop = 
icon-prev = 
icon-next = 
icon-random = 
icon-repeat = 

toggle-on-foreground = ${colors.primary}
toggle-off-foreground = ${colors.disabled}

label-song-maxlen = 40
label-song-ellipsis = true

; System Monitoring Icons
[module/cpu-icon]
type = internal/cpu
interval = 2
format = <label> <ramp-coreload>
format-prefix = "CPU "
format-prefix-foreground = ${colors.blue}
label = %percentage%%

ramp-coreload-spacing = 1
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █
ramp-coreload-foreground = ${colors.blue}

[module/memory-icon]
type = internal/memory
interval = 2
format = <label> <bar-used>
format-prefix = "RAM "
format-prefix-foreground = ${colors.magenta}
label = %gb_used%

bar-used-indicator =
bar-used-width = 10
bar-used-foreground-0 = ${colors.green}
bar-used-foreground-1 = ${colors.yellow}
bar-used-foreground-2 = ${colors.orange}
bar-used-foreground-3 = ${colors.red}
bar-used-fill = ▐
bar-used-empty = ▐
bar-used-empty-foreground = ${colors.disabled}

; Volume with Icons
[module/volume-icon]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.purple}

format-muted = <label-muted>
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${colors.alert}
label-muted = muted
label-muted-foreground = ${colors.disabled}

; Weather Icons
[module/weather]
type = custom/script
exec = curl -s 'wttr.in/?format=%c+%t'
interval = 600
format-prefix = "CPU "
format-prefix-foreground = ${colors.cyan}

; Bluetooth
[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 2
click-left = blueman-manager
click-right = ~/.config/polybar/scripts/bluetooth-toggle.sh
format-prefix = "CPU "
format-prefix-foreground = ${colors.blue}

; Notification Icons
[module/dunst]
type = custom/ipc
initial = 1
format-foreground = ${colors.yellow}

hook-0 = echo "%{A1:notify-send "DUNST_COMMAND_PAUSE" && polybar-msg hook dunst 2:}%{A}" &
hook-1 = echo "%{A1:notify-send "DUNST_COMMAND_RESUME" && polybar-msg hook dunst 1:}%{A}" &

[module/notification-github]
type = custom/script
exec = ~/.config/polybar/tokyo-night/scripts/notification-github.sh
interval = 60
format-prefix = "CPU "
format-prefix-foreground = ${colors.foreground}

[module/notification-reddit]
type = custom/script
exec = ~/.config/polybar/tokyo-night/scripts/notification-reddit.sh
interval = 60
format-prefix = "CPU "
format-prefix-foreground = ${colors.orange}

; Package Updates with Icon
[module/updates-icon]
type = custom/script
exec = ~/.config/polybar/tokyo-night/scripts/updates.sh
interval = 600
format-prefix = "CPU "
format-prefix-foreground = ${colors.yellow}
click-left = alacritty -e sudo pacman -Syu
click-right = pamac-manager

; Trash
[module/trash]
type = custom/script
exec = ~/.config/polybar/tokyo-night/scripts/trash.sh
interval = 60
format-prefix = "CPU "
format-prefix-foreground = ${colors.yellow}
click-left = nautilus trash:///
click-right = rm -rf ~/.local/share/Trash/files/*

; System Tray
[module/tray]
type = internal/tray
format = <tray>
format-background = ${colors.background}
tray-background = ${colors.background}
tray-foreground = ${colors.foreground}
tray-padding = 2
tray-size = 16

; System Tray Arrow
[module/tray-arrow]
type = custom/text
content = 
content-foreground = ${colors.disabled}
content-padding = 1