;==========================================================
;
; Tokyo Night Color Scheme for Polybar
;
;==========================================================

[colors]
; Tokyo Night colors
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
foreground-alt = #a9b1d6

; Tokyo Night accent colors
blue = #7aa2f7
cyan = #7dcfff
magenta = #bb9af7
purple = #9d7cd8
orange = #ff9e64
yellow = #e0af68
green = #9ece6a
teal = #1abc9c
red = #f7768e

; UI colors
primary = ${colors.blue}
secondary = ${colors.green}
alert = ${colors.red}
warning = ${colors.yellow}
disabled = #565f89
transparent = #00000000

; Module specific colors
cpu-color = ${colors.blue}
memory-color = ${colors.magenta}
temperature-color = ${colors.orange}
network-color = ${colors.cyan}
volume-color = ${colors.purple}
battery-color = ${colors.green}
date-color = ${colors.yellow}