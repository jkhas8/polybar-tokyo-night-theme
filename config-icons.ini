;==========================================================
;
; Tokyo Night Icon-Rich Bar Configuration
;
;==========================================================

; Include configurations
include-file = ~/.config/polybar/tokyo-night/colors.ini
include-file = ~/.config/polybar/tokyo-night/modules.ini
include-file = ~/.config/polybar/tokyo-night/modules-icons.ini
include-file = ~/.config/polybar/tokyo-night/modules-launchers.ini

;==========================================================
; Bar with Application Launchers
;==========================================================

[bar/icons]
width = 100%
height = 35
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

border-size = 0
border-color = ${colors.transparent}

padding-left = 0
padding-right = 2

module-margin-left = 1
module-margin-right = 1

font-0 = RobotoMono Nerd Font:style=Regular:size=13;3
font-1 = Hack Nerd Font:style=Regular:size=14;3
font-2 = Symbols Nerd Font:style=2048-em:size=14;3
font-3 = FontAwesome:style=Regular:size=14;3
font-4 = Noto Color Emoji:style=Regular:size=13;3
font-5 = DejaVu Sans:style=Book:size=12;3

; Module positioning with icons
modules-left = i3 xwindow
modules-center = distro-icon date
modules-right = cpu-icon memory-icon temperature network-speed wifi-icon volume-icon notification-github dunst tray powermenu

wm-restack = i3
override-redirect = false

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

;==========================================================
; Dock-style Bar
;==========================================================

[bar/dock]
width = 60%
height = 40
radius = 15
fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
line-color = ${colors.primary}

border-size = 5
border-color = ${colors.transparent}

padding-left = 2
padding-right = 2

module-margin-left = 1
module-margin-right = 1

font-0 = Hack Nerd Font:style=Bold:size=14;4
font-1 = Symbols Nerd Font:style=2048-em:size=16;4
font-2 = Symbols Nerd Font:style=2048-em:size=17;4

modules-center = launcher-menu browser terminal filemanager editor music separator spotify separator trash separator powermenu

offset-x = 20%
offset-y = 10

wm-restack = i3
override-redirect = true

cursor-click = pointer
cursor-scroll = ns-resize

;==========================================================
; Status Bar (Minimal with Icons)
;==========================================================

[bar/status]
width = 100%
height = 32
fixed-center = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = RobotoMono Nerd Font:style=Regular:size=12;3
font-1 = Hack Nerd Font:style=Regular:size=13;3
font-2 = Symbols Nerd Font:style=2048-em:size=14;3

modules-left = i3
modules-right = cpu-icon memory-icon network-speed volume-icon battery date

tray-position = right
tray-padding = 2

wm-restack = i3

;==========================================================
; Workspace Bar with Icons Only
;==========================================================

[bar/workspaces]
width = 100%
height = 35
fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 1
padding-right = 1

font-0 = Hack Nerd Font:style=Regular:size=17;4
font-1 = Symbols Nerd Font:style=2048-em:size=19;4

modules-center = i3

wm-restack = i3
override-redirect = false

enable-ipc = true