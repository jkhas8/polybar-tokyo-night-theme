;==========================================================
;
; Application Launcher Modules with Icons
;
;==========================================================

[module/launcher-menu]
type = custom/text
format = 
format-foreground = ${colors.blue}
format-padding = 2
click-left = rofi -show drun
click-right = rofi -show window

[module/browser]
type = custom/text
format = 
format-foreground = ${colors.cyan}
format-padding = 1
click-left = firefox
click-middle = google-chrome-stable
click-right = brave

[module/terminal]
type = custom/text
format = 
format-foreground = ${colors.green}
format-padding = 1
click-left = alacritty
click-right = kitty

[module/filemanager]
type = custom/text
format = 
format-foreground = ${colors.yellow}
format-padding = 1
click-left = nautilus
click-right = thunar

[module/editor]
type = custom/text
format = 
format-foreground = ${colors.magenta}
format-padding = 1
click-left = code
click-right = vim

[module/music]
type = custom/text
format = 
format-foreground = ${colors.purple}
format-padding = 1
click-left = spotify
click-right = rhythmbox