;==========================================================
;
; Tokyo Night Polybar Configuration
; i3status-inspired layout
;
;==========================================================

; Include color scheme
include-file = ~/.config/polybar/tokyo-night/colors.ini

; Include modules
include-file = ~/.config/polybar/tokyo-night/modules.ini
include-file = ~/.config/polybar/tokyo-night/modules-icons.ini

;==========================================================
; Global Settings
;==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = true

[global/wm]
margin-top = 0
margin-bottom = 0

;==========================================================
; Bar Configuration
;==========================================================

[bar/main]
; Dimensions
width = 100%
height = 35
radius = 0
fixed-center = true

; Colors
background = ${colors.background}
foreground = ${colors.foreground}

; Borders
line-size = 2
line-color = ${colors.primary}

border-size = 0
border-color = ${colors.transparent}

; Padding
padding-left = 1
padding-right = 2

module-margin-left = 1
module-margin-right = 1

; Fonts
font-0 = RobotoMono Nerd Font:style=Regular:size=13;3
font-1 = Hack Nerd Font:style=Regular:size=14;3
font-2 = Symbols Nerd Font:style=2048-em:size=15;4
font-3 = Material\-Design\-Iconic\-Font:style=Design-Iconic-Font:size=15;4
font-4 = DejaVuSansM Nerd Font:style=Book:size=13;3

; Module positioning
modules-left = launcher-menu i3 separator xwindow
modules-center = date
modules-right = filesystem separator cpu memory temperature separator network-speed eth wlan separator pulseaudio separator battery separator updates-icon separator powermenu

; System tray
tray-position = right
tray-padding = 2
tray-background = ${colors.background}

; Window manager settings
wm-restack = i3
override-redirect = false

; Mouse settings
cursor-click = pointer
cursor-scroll = ns-resize

; IPC
enable-ipc = true

;==========================================================
; Alternative Bar (Minimal)
;==========================================================

[bar/minimal]
inherit = bar/main
height = 30

modules-left = i3
modules-center = date
modules-right = cpu memory eth pulseaudio battery

tray-position = none

;==========================================================
; Alternative Bar (Top)
;==========================================================

[bar/top]
inherit = bar/main
bottom = false
modules-left = i3 xwindow
modules-center = 
modules-right = cpu memory filesystem eth wlan pulseaudio battery date powermenu

;==========================================================
; Alternative Bar (Bottom)
;==========================================================

[bar/bottom]
inherit = bar/main
bottom = true
height = 30

modules-left = i3
modules-center = xwindow
modules-right = filesystem cpu memory temperature uptime kernel

tray-position = none